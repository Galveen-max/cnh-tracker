<script>
(function(){
  // Check if already authenticated this session
  if(sessionStorage.getItem('cnh_auth')==='1'){
    document.addEventListener('DOMContentLoaded',function(){
      var g=document.getElementById('pw-gate');
      if(g) g.style.display='none';
    });
  }
})();
function checkPw(){
  var input=document.getElementById('pw-input').value;
  if(btoa(input)==='Q05IMjAyNg=='){
    sessionStorage.setItem('cnh_auth','1');
    document.getElementById('pw-gate').style.display='none';
  } else {
    document.getElementById('pw-err').style.display='block';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
}
</script>

  if(fc.length===0){document.getElementById('cases').innerHTML='<div class="empty">No cases match this filter.</div>';return;}
  document.getElementById('cases').innerHTML=fc.map(c=>{
    const exp=openCards.has(c.id);const bc=c.status==='resolved'?'resolved-card':(ub[c.urgency]||'');
    return`<div class="card ${bc}"><div class="card-head" onclick="toggle(${c.id})"><div><div class="card-title">${c.vendor}</div><div class="badges"><span class="b ${sc[c.status]}">${sl[c.status]}</span><span class="b ${uc[c.urgency]}">${c.urgency}</span><span class="b b-type">${c.type}</span><span class="b b-src">${c.source}</span></div></div><div class="card-right"><div class="amount">${c.amount}</div>${c.amountSub?`<div class="amount-sub">${c.amountSub}</div>`:''}<span class="chevron">${exp?'▲':'▼'}</span></div></div><div class="card-body${exp?' open':''}"><div class="info-grid"><div class="info-field"><label>First chase</label><span>${c.first}</span></div><div class="info-field"><label>Last chase</label><span>${c.last}</span></div><div class="info-field"><label>CNH revert</label><span class="${c.revert?'yes':'no'}">${c.revert?'Yes':'No'}</span></div><div class="info-field"><label>Inbox</label><span>${c.source}</span></div></div><div class="info-field" style="margin-bottom:8px"><label>Revert note</label><span>${c.revertNote}</span></div><div class="risk-box">${c.risk}</div><div class="divider"></div><div class="status-row"><label>Status:</label>${['open','in-progress','escalated','resolved'].map(s=>`<button class="sb${c.status===s?' '+sa[s]:''}" onclick="setStatus(${c.id},'${s}')">${sl[s]}</button>`).join('')}</div><div class="divider"></div><div class="updates-section"><div class="updates-label">Updates &amp; closure notes</div>${c.updates.length===0?'<div style="font-size:11px;color:#bbb;padding:3px 0">No updates yet.</div>':''}${c.updates.map(u=>`<div class="update-item"><div class="update-date">${u.date}</div>${u.text}</div>`).join('')}<div class="add-row"><input type="text" placeholder="Add update or closure note..." id="inp-${c.id}" value="${(inputs[c.id]||'').replace(/"/g,'&quot;')}" oninput="inputs[${c.id}]=this.value" onkeydown="if(event.key==='Enter')addUpdate(${c.id})"><button class="save-btn" onclick="addUpdate(${c.id})">Save</button></div></div></div></div>`;
  }).join('');
}
cases=load();render();
</script>
</body>
</html>
